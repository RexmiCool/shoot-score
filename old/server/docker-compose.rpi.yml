# docker-compose.rpi.yml — Déploiement sur Raspberry Pi (ARM64, sans GPU)
#
# Usage :
#   docker compose -f docker-compose.rpi.yml up -d
#
# Différences par rapport à docker-compose.yml :
#   - Pas de réservation GPU NVIDIA (pas disponible sur RPi)
#   - Tag d'image spécifique :rpi pour distinguer des images x86
#   - Le moteur de détection bascule automatiquement vers ONNX Runtime (CPU)
#     si les poids .onnx sont présents, sinon vers la détection morphologique.

services:
  api:
    build:
      context: ../..
      dockerfile: old/server/Dockerfile
    image: shoot-score-api:rpi
    container_name: shoot-score-api
    ports:
      - "8000:8000"
    volumes:
      # Poids YOLO entraînés (.onnx recommandé sur RPi, voir README)
      - ../../runs:/app/runs:ro
      # Sorties persistées sur l'hôte entre les redémarrages
      - ../../outputs:/app/outputs
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    # Pas de bloc 'deploy' : aucun GPU sur Raspberry Pi
