
[project]
name = "shoot-score"
version = "0.1.0"
description = "Detect 9mm impacts on a CIBLE (OpenCV)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-contrib-python>=4.9 ; sys_platform != 'linux'",
  "opencv-contrib-python-headless>=4.9 ; sys_platform == 'linux'",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "ruff>=0.15.4",
  "ultralytics>=8.4.33",
  "torch>=2.0 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "torchvision>=0.21 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "onnxruntime>=1.17 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["black>=24.0", "ruff>=0.3", "pytest>=8.0"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

# ── Index PyTorch ─────────────────────────────────────────────────────────────
# CUDA 12.4 sur x86_64 Windows/Linux uniquement.
# Sur ARM (Raspberry Pi, Apple Silicon) → PyPI CPU automatiquement.
[[tool.uv.index]]
name = "pytorch-cu124"
url  = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "(sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "(sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

# ── Environnements cibles pour le lock multi-plateforme ───────────────────────
# Permet à uv de générer un uv.lock valide pour toutes ces plateformes
# depuis n'importe quel OS (ex : généré sur Windows, utilisé sur RPi).
[tool.uv]
environments = [
  "sys_platform == 'win32'  and platform_machine == 'AMD64'",
  "sys_platform == 'linux'  and platform_machine == 'x86_64'",
  "sys_platform == 'linux'  and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
