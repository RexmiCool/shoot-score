version: '3.8'

services:

  shootscore-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./db:/app/db
    environment:
      - API_SECRET_TOKEN=${API_SECRET_TOKEN}
      - UPLOAD_DIR=/app/data/uploads
      - DB_PATH=/app/db/shootscore.db
    restart: unless-stopped

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: